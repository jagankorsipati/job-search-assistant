spring.application.name=job-search-assistant
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:job_search_assistant}
spring.datasource.username=${DB_USERNAME:job_search_assistant}
spring.datasource.password=${DB_PASSWORD:local_dev_only_change_me}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=job_search_assistant
spring.flyway.default-schema=job_search_assistant
spring.flyway.create-schemas=true
spring.sql.init.mode=never
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

identity.bootstrap.enabled=${IDENTITY_BOOTSTRAP_ENABLED:false}
identity.invitation.lifetime=${IDENTITY_INVITATION_LIFETIME:24h}

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=job_search_assistant.spring_session
spring.session.timeout=${SESSION_IDLE_TIMEOUT:30m}
server.servlet.session.cookie.name=JSA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
identity.session.absolute-timeout=${SESSION_ABSOLUTE_TIMEOUT:12h}
identity.login-rate-limit.source-attempts=${LOGIN_RATE_LIMIT_SOURCE_ATTEMPTS:20}
identity.login-rate-limit.login-attempts=${LOGIN_RATE_LIMIT_LOGIN_ATTEMPTS:5}
identity.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:15m}
identity.login-rate-limit.max-keys=${LOGIN_RATE_LIMIT_MAX_KEYS:1000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
