name: Foundation verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21 with Maven cache
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify and package backend
        working-directory: backend
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

      - name: Confirm executable JAR
        run: test -s backend/target/backend-0.0.1-SNAPSHOT.jar

      - name: Archive backend test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports-${{ github.run_id }}
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository Node version with npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use pinned npm version
        run: npm install --global npm@11.16.0

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check formatting
        working-directory: frontend
        run: npm run format:check

      - name: Lint with zero warnings
        working-directory: frontend
        run: npm run lint

      - name: Validate strict TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Run component tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Confirm frontend build output
        run: test -s frontend/dist/index.html

  infrastructure:
    name: PostgreSQL Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: job-search-assistant-ci
      DB_PORT: "55432"
      DB_NAME: job_search_assistant_ci
      DB_USERNAME: job_search_assistant_ci
      DB_PASSWORD: ci_only_not_a_secret
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and wait for health
        run: docker compose up -d --wait postgres

      - name: Verify PostgreSQL readiness
        run: docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

      - name: Stop Compose services
        if: always()
        run: docker compose down --remove-orphans
