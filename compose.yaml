services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_DB: ${DB_NAME:-job_search_assistant}
      POSTGRES_USER: ${DB_USERNAME:-job_search_assistant}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
